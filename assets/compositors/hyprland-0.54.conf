# Hyprland 0.54 (hyprlang); use the Lua example for >= 0.55.
# https://wiki.hypr.land/0.54.0/Configuring/Window-Rules/
# Add these rules to your existing config. Vertex window.opacity supplies alpha.
windowrule {
    name = vertex
    match:class = ^vertex$
    rounding = 12
    border_size = 2
    no_blur = off
}
